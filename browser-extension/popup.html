<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 12px; background: #f8f9fb; color: #222; font-size: 13px;
}
h1 { font-size: 15px; margin-bottom: 4px; color: #3483fa; }
.sub { color: #888; font-size: 11px; margin-bottom: 12px; }
.status {
  padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px;
}
.status.ok { background: #e9f9ee; color: #1a7f37; }
.status.bad { background: #fef1f1; color: #bf3a30; }
.status.neutral { background: #f0f3f7; color: #555; }
.btn {
  display: block; width: 100%; padding: 9px 12px; margin-top: 8px;
  background: #3483fa; color: white; border: none; border-radius: 6px;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
}
.btn:hover { background: #2968c8; }
.btn.secondary { background: #fff; color: #3483fa; border: 1px solid #3483fa; }
.btn.secondary:hover { background: #f0f7ff; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.count { font-size: 11px; color: #888; margin-top: 6px; text-align: center; }
.divider { height: 1px; background: #e5e7eb; margin: 12px 0; }
.erp-link {
  display: block; text-align: center; margin-top: 8px;
  color: #3483fa; text-decoration: none; font-size: 12px;
}
.erp-link:hover { text-decoration: underline; }
#msg { margin-top: 8px; font-size: 11px; color: #666; min-height: 14px; }
</style>
</head>
<body>
<h1>📊 美客多 ERP 选品助手</h1>
<div class="sub">在 MercadoLibre / 1688 页面一键采集并推送至 ERP 评分</div>

<div id="status" class="status neutral">检测中...</div>

<button id="pushBtn" class="btn" disabled>📦 推送当前页商品到 ERP</button>
<button id="batchBtn" class="btn secondary" style="display:none">📋 批量推送列表页商品</button>

<div id="msg"></div>
<div class="divider"></div>
<div id="storeCount" class="count">ERP 暂存：0 条</div>
<a href="https://mercado-libre-erp.vercel.app/hot-ranking" target="_blank" class="erp-link">
  🔗 打开 ERP 热销榜选品 →
</a>

<script src="popup.js"></script>
</body>
</html>
